[pytest]
# Pytest configuration for Netro Plugin tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov="Netro Sprinklers.indigoPlugin/Contents/Server Plugin"
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

# Markers for categorizing tests
markers =
    api: Tests for API client functionality
    handlers: Tests for device handler functionality
    validation: Tests for configuration and action validation
    actions: Tests for action callback methods
    integration: Integration tests requiring external services
    slow: Tests that take more than 1 second

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
