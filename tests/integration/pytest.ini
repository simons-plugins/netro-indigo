[pytest]
# Pytest config for the TestingBase integration suite (Pattern B).
#
# The netro repo's main pytest.ini at the repo root sets `addopts` with
# coverage flags for Pattern A. Those flags require pytest-cov, which the
# integration venv doesn't install (coverage of TestingBase tests against
# live Indigo isn't meaningful — they don't import netro source).
#
# A pytest.ini here makes this directory its own rootdir, isolating the
# integration suite from the main env's addopts. Run with:
#
#     source ../venv/bin/activate
#     pytest          # picks up THIS config
#
# Or from netro repo root:
#
#     pytest tests/integration/   # pytest finds this config via rootdir search

# Empty addopts — no coverage, no strict markers from the main config.
addopts =
