[project]
name = "netro-sprinklers-indigo"
version = "2.1.0"
description = "Indigo plugin for Netro smart irrigation controllers"
requires-python = ">=3.10"

[tool.pylint.main]
# Target Python version (Indigo 2023.2+ requires 3.10+)
py-version = "3.10"

# Exit with error if score below this
fail-under = 9.0

# Use all available cores
jobs = 0

# Paths to ignore
ignore-paths = ["tests", "__pycache__"]

[tool.pylint.format]
# Match existing codebase style
max-line-length = 120

[tool.pylint.design]
# Plugin has large main class by necessity
max-attributes = 20
max-args = 8

[tool.pylint."messages control"]
# Disable rules that conflict with Indigo plugin patterns
disable = [
    "too-many-lines",           # Single-file plugin by design (will be split in Phase 5)
    "too-many-public-methods",  # Plugin class requires many callbacks for Indigo API
    "invalid-name",             # Indigo uses camelCase callbacks (actionControlSprinkler, etc)
]

[tool.pylint.basic]
# Allow Indigo's camelCase callback names
method-rgx = "[a-z_][a-zA-Z0-9_]{2,}$"

[tool.pytest.ini_options]
# Keep existing pytest config from pytest.ini here for reference
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# TestingBase lives in tests/venv/ and tests/shared/ (submodule). Don't
# recurse there from the main env — they need their own venv to import
# `shared`. tests/integration/ runs only via that venv too.
norecursedirs = ["tests/integration", "tests/shared", "tests/venv"]
